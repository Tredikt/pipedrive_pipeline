services:
  pipedrive-webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Все фоновые задания по расписанию: docker/cron.d/*.cron + скрипты docker/cron/*.sh.
  # При старте контейнера собирается /etc/cron.d/app-crontabs и выполняется cron -f.
  # Добавьте новый job: файл docker/cron.d/20-*.cron и при необходимости docker/cron/run-*.sh.
  # Расписание без пересборки: смонтируйте каталог (см. volumes ниже).
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    # Те же переменные (.env рядом с compose). Cron не наследует env процесса — см. docker/entrypoint-cron.sh.
    # GA: файл google_oauth_client.json не в образе crona — нужен volumes ниже, иначе FileNotFoundError в auth.py.
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # OAuth Desktop JSON (не кладём в образ). Путь как на хосте: ./ от каталога compose.
      - ./google_oauth_client.json:/app/google_oauth_client.json:ro
      # Файл токена после первого входа локально или внутри cron; опционально, если задаёте только GA_REFRESH_TOKEN в .env
      # - ./google_analytics_token.json:/app/google_analytics_token.json:rw
      # Свои crontabs без rebuild:
      # - ./docker/cron.d:/app/docker/cron.d:ro
